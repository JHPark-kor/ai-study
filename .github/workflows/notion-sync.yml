name: Read W13 Notion submissions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read W13 pages and attachments
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          STUDY_WEEK_NUMBER: '13'
        run: python .github/scripts/export_notion_week.py
      - name: Save short-lived source files for review
        uses: actions/upload-artifact@v4
        with:
          name: notion-w13-source
          path: notion-week-export/
          retention-days: 1
          if-no-files-found: error

